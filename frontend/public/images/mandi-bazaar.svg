<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="240" height="180" rx="16" fill="url(#bgGrad)" />
  
  <!-- Sun & Cloud -->
  <circle cx="190" cy="40" r="22" fill="#fde047" opacity="0.8" />
  <ellipse cx="170" cy="50" rx="18" ry="10" fill="#ffffff" opacity="0.8" />
  <ellipse cx="185" cy="45" rx="14" ry="10" fill="#ffffff" opacity="0.9" />

  <!-- Mandi Grain Shed -->
  <polygon points="120,45 60,70 180,70" fill="#15803d" />
  <rect x="70" y="70" width="100" height="50" fill="#ffffff" stroke="#16a34a" stroke-width="2" rx="4" />
  <!-- Pillars -->
  <rect x="80" y="75" width="8" height="45" fill="#ca8a04" />
  <rect x="116" y="75" width="8" height="45" fill="#ca8a04" />
  <rect x="152" y="75" width="8" height="45" fill="#ca8a04" />

  <!-- Burlap Sacks of Harvest -->
  <ellipse cx="65" cy="135" rx="16" ry="18" fill="#d97706" />
  <ellipse cx="65" cy="120" rx="6" ry="3" fill="#b45309" />
  <!-- Tied string -->
  <rect x="62" y="118" width="6" height="2" fill="#fef3c7" />

  <ellipse cx="85" cy="140" rx="16" ry="18" fill="#b45309" />
  <ellipse cx="85" cy="125" rx="6" ry="3" fill="#78350f" />
  <rect x="82" y="123" width="6" height="2" fill="#fef3c7" />

  <!-- Weighing Scale / Tula -->
  <g transform="translate(145, 100) scale(0.7)">
    <line x1="40" y1="10" x2="40" y2="60" stroke="#334155" stroke-width="4" />
    <line x1="15" y1="20" x2="65" y2="20" stroke="#334155" stroke-width="3" />
    <!-- Left pan -->
    <line x1="15" y1="20" x2="8" y2="40" stroke="#64748b" stroke-width="1.5" />
    <line x1="15" y1="20" x2="22" y2="40" stroke="#64748b" stroke-width="1.5" />
    <path d="M5 40 Q15 48 25 40 Z" fill="#94a3b8" />
    <!-- Right pan (holding grain) -->
    <line x1="65" y1="20" x2="58" y2="42" stroke="#64748b" stroke-width="1.5" />
    <line x1="65" y1="20" x2="72" y2="42" stroke="#64748b" stroke-width="1.5" />
    <path d="M55 42 Q65 50 75 42 Z" fill="#94a3b8" />
    <circle cx="65" cy="38" r="6" fill="#f59e0b" />
    <!-- Base -->
    <rect x="25" y="60" width="30" height="6" rx="2" fill="#1e293b" />
  </g>

  <!-- Ground -->
  <path d="M0 150 Q120 145 240 150 L240 180 L0 180 Z" fill="#15803d" opacity="0.15" />
  <path d="M0 160 Q120 155 240 160 L240 180 L0 180 Z" fill="#16a34a" opacity="0.25" />
</svg>
